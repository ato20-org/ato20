# O que roda a cada commit na `main`.
#
# Não empacota nada: quem gera instalador é `empacotar.yml`, na `production`.
# Aqui a pergunta é só "isto compila e os testes passam".
#
# Um job só, e não um para o web e outro para o Rust, por uma razão prática: o
# `cargo test` do aplicativo passa pelo `tauri-build`, que lê o `tauri.conf.json`
# e espera achar o `frontendDist` em `../out`. Separar em dois daria um job
# rápido e um quebrado.

name: verificar

# Texto e mídia não compilam nem têm teste: um GIF novo em `docs/midia` ou uma
# frase no README rodavam a WebKitGTK, o build e o Rust inteiros para nada.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

# Um push novo na PR cancela a execução que ainda verificava o anterior: o
# resultado dela já não diz nada sobre o que vai ser mesclado. Na `main` não
# cancela -- cada commit dela fica com o próprio resultado.
concurrency:
  group: verificar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # O Rust só na PR que mexe nele, e sempre no push da `main`.
      #
      # Compilar o app para o `cargo test` é o passo mais caro daqui (os
      # testes em si levam seis segundos), e uma PR só de interface pagava
      # isso inteiro, mais a WebKitGTK do apt, sem tocar uma linha de Rust. O
      # próprio workflow entra na lista: mudar a CI tem de passar pela CI
      # inteira.
      #
      # Pela API e não por `git diff`: o checkout é raso, e buscar o histórico
      # todo traria junto o peso da mídia antiga. Se a pergunta falhar, roda
      # -- pular por engano é pior que rodar à toa.
      - name: Mudou o Rust?
        id: rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! arquivos=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename'); then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$arquivos" | grep -qE '^(src-tauri/|\.github/workflows/)'; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          fi

      # Do que a webview precisa para o Rust compilar. Mesmos pacotes do
      # ambiente de desenvolvimento -- o `tauri` linka contra a WebKitGTK. O
      # build do web não usa nenhum deles.
      - name: Dependências do sistema
        if: steps.rust.outputs.mudou == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.rust.outputs.mudou == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.rust.outputs.mudou == 'true'
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # `next build` roda o TypeScript junto -- não há `ignoreBuildErrors` no
      # `next.config.ts`, então erro de tipo derruba aqui. E é ele que escreve o
      # `out/` que o passo seguinte precisa.
      - name: Build do web
        run: pnpm pdfjs && pnpm build

      - name: Testes do Rust
        if: steps.rust.outputs.mudou == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml
