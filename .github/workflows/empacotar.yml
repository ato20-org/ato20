# Gera os instaladores e publica a release, só na `production`.
#
# Empacotar custa dezenas de minutos entre os dois sistemas, e a `main` recebe
# commit o dia inteiro. Então `main` verifica e `production` publica: subir
# versão é mesclar `main` na `production`.
#
# `workflow_dispatch` fica junto para poder rodar à mão sem inventar um commit.
#
# Cada sistema no próprio runner porque não há atalho: o Tauri usa o toolchain
# nativo de cada um -- WebKitGTK no Linux, WebView2 e MSVC no Windows --, e
# cruzar de um para o outro não é caminho suportado.

name: empacotar

on:
  push:
    branches: [production]
  workflow_dispatch:

# Só `contents`, e é o que a release precisa. O padrão do repositório pode ser
# mais generoso; declarar aqui fecha o resto para este workflow.
permissions:
  contents: write

jobs:
  versao:
    runs-on: ubuntu-22.04
    outputs:
      numero: ${{ steps.ler.outputs.numero }}
      release_id: ${{ steps.release.outputs.id }}

    steps:
      - uses: actions/checkout@v4

      # A versão sai do `tauri.conf.json`, que é a mesma que vai no instalador.
      # Escrever o número no workflow daria duas fontes da verdade, e a segunda
      # é sempre a que fica para trás.
      - id: ler
        run: echo "numero=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      # A release nasce AQUI, uma vez, antes da matriz -- e não dentro da
      # `tauri-action` de cada runner. Os dois runners corriam para criá-la: na
      # 0.7.0 o Windows venceu e o Linux falhou com `already_exists` depois de
      # ter construído os três pacotes, e a release saiu só com `.exe` e `.msi`.
      # Com o id em mãos, cada runner só anexa o que construiu.
      #
      # Idempotente: se a tag já tem release (uma reexecução do workflow), usa a
      # que existe. `--latest` porque é ELE, junto com não ser pré-lançamento,
      # que faz `releases/latest/download/latest.json` responder -- ver #58.
      #
      # O corpo é genérico de propósito: um texto que diga "primeira versão"
      # deixa de ser verdade na segunda. O que mudou vai nas notas, escritas a
      # cada release a partir de `src/lib/versoes.ts` -- ver a skill
      # `lancar-release`.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ler.outputs.numero }}
        run: |
          if ! gh release view "$TAG" --json id --jq .id >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ATO20 $TAG" \
              --latest \
              --notes "$(cat <<'EOF'
          Beta: dá para jogar com ele, e ainda há aresta.

          **Linux** — `.AppImage` roda sem instalar, e na primeira abertura
          ele mesmo põe o atalho no menu (rofi, wofi e afins). Basta dar
          permissão de execução: `chmod +x ato20_*.AppImage`. `.deb` e `.rpm`
          para quem prefere instalar pelo gerenciador.
          **Windows** — `.msi` ou o instalador `.exe`. Os dois saem SEM
          assinatura de código, então o SmartScreen vai avisar: "Mais
          informações" e "Executar mesmo assim".
          EOF
          )"
          fi
          # O id numérico da API, que é o que a `tauri-action` recebe.
          echo "id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)" >> "$GITHUB_OUTPUT"

  empacotar:
    needs: versao

    strategy:
      # Sem `fail-fast`: um erro só do Windows não pode jogar fora o pacote de
      # Linux que já ficou pronto.
      fail-fast: false
      matrix:
        include:
          # 22.04 e não o `latest`: o binário linka contra a glibc de quem o
          # compilou, então compilar no mais novo produz um pacote que não roda
          # em distro um pouco mais velha. Aqui o mais antigo disponível é o que
          # alcança mais gente.
          - os: ubuntu-22.04
            nome: linux
          - os: windows-latest
            nome: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        if: matrix.nome == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.nome }}

      - run: pnpm install --frozen-lockfile

      # A action oficial faz o que daria dois passos à mão: empacota, ASSINA
      # cada pacote com a chave do updater e sobe os arquivos e o `latest.json`
      # que o aplicativo instalado vai ler. Criar a release não é mais com ela
      # -- ver o job `versao`, que a cria uma vez e entrega o id. Com
      # `releaseId`, a action anexa e não cria, e dois runners deixam de
      # disputar a tag.
      #
      # A release já nasce sem rascunho e sem pré-lançamento, e é isso que liga
      # o updater: o endpoint é `releases/latest/download/latest.json`, e o
      # atalho `latest` do GitHub IGNORA pré-lançamento e rascunho não tem URL
      # pública. Ver a issue #58.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A privada nunca sai dos segredos, e não existe em arquivo nenhum do
          # repositório. Ver `tauri-plugin-updater` no `Cargo.toml`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.versao.outputs.release_id }}
