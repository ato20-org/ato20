# Gera os instaladores e publica a release, só na `production`.
#
# Empacotar custa dezenas de minutos entre os dois sistemas, e a `main` recebe
# commit o dia inteiro. Então `main` verifica e `production` publica: subir
# versão é mesclar `main` na `production`.
#
# `workflow_dispatch` fica junto para poder rodar à mão sem inventar um commit.
#
# Cada sistema no próprio runner porque não há atalho: o Tauri usa o toolchain
# nativo de cada um -- WebKitGTK no Linux, WebView2 e MSVC no Windows --, e
# cruzar de um para o outro não é caminho suportado.

name: empacotar

on:
  push:
    branches: [production]
  workflow_dispatch:

# Só `contents`, e é o que a release precisa. O padrão do repositório pode ser
# mais generoso; declarar aqui fecha o resto para este workflow.
permissions:
  contents: write

jobs:
  versao:
    runs-on: ubuntu-22.04
    outputs:
      numero: ${{ steps.ler.outputs.numero }}

    steps:
      - uses: actions/checkout@v4

      # A versão sai do `tauri.conf.json`, que é a mesma que vai no instalador.
      # Escrever o número no workflow daria duas fontes da verdade, e a segunda
      # é sempre a que fica para trás.
      - id: ler
        run: echo "numero=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

  empacotar:
    needs: versao

    strategy:
      # Sem `fail-fast`: um erro só do Windows não pode jogar fora o pacote de
      # Linux que já ficou pronto.
      fail-fast: false
      matrix:
        include:
          # 22.04 e não o `latest`: o binário linka contra a glibc de quem o
          # compilou, então compilar no mais novo produz um pacote que não roda
          # em distro um pouco mais velha. Aqui o mais antigo disponível é o que
          # alcança mais gente.
          - os: ubuntu-22.04
            nome: linux
          - os: windows-latest
            nome: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        if: matrix.nome == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.nome }}

      - run: pnpm install --frozen-lockfile

      # A action oficial faz o que daria três passos à mão: empacota, ASSINA
      # cada pacote com a chave do updater, cria a release se ela ainda não
      # existe e sobe o `latest.json` que o aplicativo instalado vai ler.
      #
      # `releaseDraft: false` porque rascunho não tem URL pública, e é
      # justamente a URL que o endpoint do updater aponta -- uma release em
      # rascunho deixaria o `latest.json` inalcançável.
      #
      # `prerelease: false`, e é ELE que liga o updater. O endpoint do
      # aplicativo é `releases/latest/download/latest.json`, e o atalho `latest`
      # do GitHub IGNORA pré-lançamento: enquanto toda release foi alpha, esse
      # endereço respondeu 404 e ninguém que instalou se atualizou. Marcar
      # pré-lançamento de novo desliga a atualização automática outra vez -- não
      # é rótulo, é chave. Ver a issue #58.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A privada nunca sai dos segredos, e não existe em arquivo nenhum do
          # repositório. Ver `tauri-plugin-updater` no `Cargo.toml`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # A tag é só o número, sem sufixo. O `-alpha` saiu junto com o
          # `prerelease`, e não por enfeite: o sufixo na tag não dizia nada ao
          # GitHub, e atrapalhava quem casa a tag com um empacotador de loja.
          tagName: v${{ needs.versao.outputs.numero }}
          releaseName: ATO20 v${{ needs.versao.outputs.numero }}
          # Genérico de propósito: um texto que diga "primeira versão" deixa de
          # ser verdade na segunda, e ninguém lembra de voltar aqui. O que
          # mudou na versão vai nas notas, escritas a cada release a partir de
          # `src/lib/versoes.ts` -- ver a skill `lancar-release`.
          releaseBody: |
            Beta: dá para jogar com ele, e ainda há aresta.

            **Linux** — `.AppImage` roda sem instalar, e na primeira abertura
            ele mesmo põe o atalho no menu (rofi, wofi e afins). Basta dar
            permissão de execução: `chmod +x ato20_*.AppImage`. `.deb` e `.rpm`
            para quem prefere instalar pelo gerenciador.
            **Windows** — `.msi` ou o instalador `.exe`. Os dois saem SEM
            assinatura de código, então o SmartScreen vai avisar: "Mais
            informações" e "Executar mesmo assim".
          releaseDraft: false
          prerelease: false
